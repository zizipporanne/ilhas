<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Social Urbano 2D</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090b0f;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #e2e8f0;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      /* Canvas onde é renderizada a simulação isométrica */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
        background: #000;
      }

      /* Controlo de câmara no canto superior direito */
      .controls-overlay {
        position: absolute;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 8px;
        z-index: 10;
      }

      .btn-control {
        background: rgba(15, 23, 42, 0.85);
        color: #f8fafc;
        border: 1px solid #334155;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        backdrop-filter: blur(6px);
        transition: background 0.2s, border-color 0.2s;
      }

      .btn-control:hover {
        background: rgba(30, 41, 59, 0.95);
        border-color: #475569;
      }

      /* Painel informativo no canto superior esquerdo */
      .info-panel {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid #334155;
        padding: 12px 16px;
        border-radius: 8px;
        backdrop-filter: blur(6px);
        font-size: 12px;
        line-height: 1.5;
        z-index: 10;
        pointer-events: none;
      }

      .info-panel h1 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #38bdf8;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Painel sobreposto opcional de estatísticas da simulação -->
      <div class="info-panel">
        <h1>Painel Social Urbano</h1>
        <p>Atalhos: <strong>Q</strong> / <strong>E</strong> para rodar a câmara</p>
      </div>

      <!-- Botões de rotação isométrica -->
      <div class="controls-overlay">
        <button id="btnRotateLeft" class="btn-control">↺ Rodar (Q)</button>
        <button id="btnRotateRight" class="btn-control">↻ Rodar (E)</button>
      </div>

      <!-- Elemento Canvas esperado pelo main.js -->
      <canvas id="simulationCanvas"></canvas>
    </div>

    <!-- Script do Vite -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
