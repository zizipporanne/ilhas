<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Terreno Agroflorestal 3D</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, sans-serif;
            background: #b8c4d0;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Barra de nível da água */
        #painel-agua {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;

            color: white;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            padding: 16px 22px;
            border-radius: 16px;

            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            user-select: none;
        }

        .slider-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .slider-track {
            position: relative;
            width: 280px;
            height: 5px;
            background: rgba(114, 31, 31, 0.18);
            border-radius: 5px;
        }

        .slider-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 10%;
            height: 100%;
            background: #4a90d9;
            border-radius: 5px;
            transition: width 0.05s linear;
        }

        .slider-thumb {
            position: absolute;
            top: 50%;
            left: 10%;

            width: 17px;
            height: 17px;

            background: #4a90d9;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;

            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.3);
            transition: left 0.05s linear;
        }

        .slider-tooltip {
            position: absolute;
            left: 10%;
            bottom: 24px;

            color: white;
            background: rgba(40, 40, 40, 0.95);
            padding: 4px 9px;
            border-radius: 4px;

            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            pointer-events: none;

            transform: translateX(-50%);
            transition: left 0.05s linear;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .slider-tooltip::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 100%;
            transform: translateX(-50%);

            border: 5px solid transparent;
            border-top-color: rgba(40, 40, 40, 0.95);
        }

        #nivel-slider {
            position: absolute;
            top: -20px;
            left: -10px;

            width: 300px;
            height: 45px;

            margin: 0;
            opacity: 0;
            cursor: pointer;
            touch-action: none;
        }

        .slider-label {
            font-size: 11px;
            opacity: 0.75;
            text-align: center;
            white-space: nowrap;
        }

        /* Grupo de botões */
        .icon-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 30;

            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Estilo comum para todos os botões */
        .control-icon,
        #toggle-ui {
            position: relative;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 48px;
            height: 48px;
            padding: 0;

            overflow: hidden;
            border: 0;
            border-radius: 50%;

            color: white;
            background: rgba(0, 0, 0, 0.72);
            cursor: pointer;

            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.25);

            transition:
                transform 0.2s ease,
                opacity 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        /* Efeito interno dos botões */
        .control-icon::before,
#toggle-ui::before {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    transform: scale(0);
    transition: transform 0.25s ease;

    pointer-events: none;
}


        .control-icon span,
        #toggle-ui svg {
            position: relative;
            z-index: 1;

            transition: transform 0.2s ease;
        }

        .control-icon span {
            font-size: 22px;
            line-height: 1;
        }

        /* Interação */
        .control-icon:hover,
        #toggle-ui:hover {
            transform: scale(1.08);
            background: rgba(0, 0, 0, 0.85);
        }

        .control-icon:hover::before,
        .control-icon.active::before,
        #toggle-ui:hover::before {
            transform: scale(1);
        }

        .control-icon:hover span,
        .control-icon.active span,
        #toggle-ui:hover svg {
            transform: scale(1.1);
        }

        /* Estado desligado */
        .control-icon.off {
            opacity: 0.4;
            filter: grayscale(1);
        }

        /* Cores individuais */
        .icon-water {
            box-shadow: inset 0 0 0 2px #4a90d9;
        }

        .icon-water::before {
            background: #4a90d9;
        }

        .icon-retro {
            box-shadow: inset 0 0 0 2px #c82647;
        }

        .icon-retro::before {
            background: #c82647;
        }

        .icon-vegetation {
            box-shadow: inset 0 0 0 2px #16a085;
        }

        .icon-vegetation::before {
            background: #16a085;
        }

        /* Botão de esconder interface */
        #toggle-ui {
            position: fixed;
            top: 82px;
            right: 20px;
            z-index: 30;
        }

        /* Interface escondida */
        body.ui-hidden #painel-agua {
            opacity: 0;
            pointer-events: none;
        }

        body.ui-hidden .icon-controls {
            opacity: 0.25;
        }

        body.ui-hidden .icon-controls:hover,
        body.ui-hidden #toggle-ui:hover {
            opacity: 1;
        }

        /* Celulares */
        @media (max-width: 700px) {
            #painel-agua {
                top: 12px;
                padding: 14px 16px;
            }

            .slider-track {
                width: 220px;
            }

            #nivel-slider {
                width: 240px;
            }

            .icon-controls {
                top: 70px;
                right: 12px;
                gap: 6px;
            }

            .control-icon,
            #toggle-ui {
                width: 40px;
                height: 40px;
            }

            .control-icon span {
                font-size: 18px;
            }

            #toggle-ui {
                top: 122px;
                right: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Barra horizontal da água -->
    <div id="painel-agua">
        <div class="slider-wrap">
            <div class="slider-track">
                <div
                    id="slider-fill"
                    class="slider-fill"
                ></div>

                <div
                    id="slider-thumb"
                    class="slider-thumb"
                ></div>

                <div
                    id="slider-tooltip"
                    class="slider-tooltip"
                >
                    29 m
                </div>

                <input
                    id="nivel-slider"
                    type="range"
                    min="0"
                    max="0.2"
                    step="0.001"
                    value="0.0203"
                    aria-label="Nível da água"
                />
            </div>

            <div class="slider-label">
                Nível da água
            </div>
        </div>
    </div>

    <!-- Botões circulares -->
    <div class="icon-controls">

        <button
            id="toggle-hidrografia"
            class="control-icon icon-water active"
            type="button"
            title="Mostrar ou ocultar hidrografia"
            aria-label="Mostrar ou ocultar hidrografia"
        >
            <span>💧</span>
        </button>

        <button
            id="toggle-retro-icon"
            class="control-icon icon-retro active"
            type="button"
            title="Ligar ou desligar shader retro"
            aria-label="Ligar ou desligar shader retro"
        >
            <span>◈</span>
        </button>

        <button
            id="toggle-vegetacao"
            class="control-icon icon-vegetation active"
            type="button"
            title="Mostrar ou ocultar vegetação"
            aria-label="Mostrar ou ocultar vegetação"
        >
            <span>🌿</span>
        </button>
    </div>

    <!-- Botão para esconder interface -->
    <button
        id="toggle-ui"
        type="button"
        title="Esconder ou mostrar interface"
        aria-label="Esconder ou mostrar interface"
    >
        <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
            />

            <line
                x1="1"
                y1="1"
                x2="23"
                y2="23"
            />
        </svg>
    </button>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
